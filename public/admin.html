<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>관리자 · 학년 마무리 퀴즈</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin">
  <main class="shell">

    <!-- 로그인: 관리자 코드만 입력 -->
    <section class="card" id="login-view" style="max-width:420px;margin:40px auto">
      <h1>관리자 로그인</h1>
      <form id="login-form">
        <div class="field">
          <label class="title" for="login-code">관리자 코드</label>
          <input type="password" id="login-code" inputmode="numeric" autocomplete="off" required>
        </div>
        <p class="error-text" id="login-error" hidden></p>
        <button class="btn" type="submit">들어가기</button>
      </form>
      <a class="btn secondary" href="/" id="login-home" style="margin-top:10px">← 첫 화면으로</a>
    </section>

    <!-- 관리 화면 -->
    <div id="main-view" hidden>
      <div class="topbar">
        <h1>학년 마무리 퀴즈 · 관리자</h1>
        <div class="topbar-actions">
          <a class="btn secondary small" href="/" id="home-btn">🏠 첫 화면으로</a>
          <button class="btn secondary small" id="logout-btn">로그아웃</button>
        </div>
      </div>

      <div class="tabs" id="main-tabs">
        <button class="tab active" data-tab="status">수료 현황</button>
        <button class="tab" data-tab="questions">문항 관리</button>
      </div>

      <!-- 수료 현황: 학년 탭 > 학급 탭 > 번호 -->
      <section class="card" id="tab-status">
        <div class="tabs" id="status-grades"></div>
        <div class="tabs sub" id="status-classes"></div>
        <div class="summary" id="status-summary"></div>
        <div class="seat-grid" id="seat-grid"></div>
        <div class="legend">
          <span>⬜ 미참여</span><span>🟨 풀이 중/중단</span><span>🟩 수료</span><span>🟥 미수료</span>
          <span>· 일반/넌센스 퀴즈 중 어느 쪽이든 5문제를 모두 맞히면 수료예요. 수료한 번호를 누르면 재참여를 승인할 수 있어요. (미수료는 승인 없이 계속 도전)</span>
        </div>
      </section>

      <!-- 문항 관리 -->
      <section class="card" id="tab-questions" hidden>

        <!-- 엑셀 일괄 업로드 -->
        <div class="bulk">
          <h3>엑셀로 한 번에 올리기</h3>
          <p class="muted" style="margin:0">① 양식 내려받기 → ② 문항 작성 후 저장 → ③ 파일 선택(자동 검사) → ④ 등록하기</p>
          <div class="bulk-actions">
            <a class="btn secondary small" href="/templates/question_template.xlsx" download="문항_업로드_양식.xlsx">📥 엑셀 양식 내려받기</a>
            <input type="file" id="bulk-file" accept=".xlsx,.xls">
          </div>
          <div class="bulk-result" id="bulk-result"></div>
          <button class="btn small" id="bulk-submit" type="button" hidden>이대로 등록하기</button>
        </div>

        <!-- 한 문항씩 입력 -->
        <form id="q-form">
          <h3>문항 하나씩 추가</h3>

          <div class="field">
            <div class="step-title"><span class="num">1</span>학년 선택</div>
            <select id="q-grade-select"></select>
          </div>

          <div class="field">
            <div class="step-title"><span class="num">2</span>구분 선택</div>
            <div class="seg-group">
              <label class="seg"><input type="radio" name="category" value="regular" checked><span>일반 퀴즈 문제</span></label>
              <label class="seg"><input type="radio" name="category" value="nonsense"><span>넌센스 퀴즈 문제</span></label>
            </div>
          </div>

          <div class="field">
            <div class="step-title"><span class="num">3</span>형식 선택</div>
            <div class="seg-group">
              <label class="seg"><input type="radio" name="type" value="mc" checked><span>객관식 (4지선다)</span></label>
              <label class="seg"><input type="radio" name="type" value="ox"><span>O X 퀴즈</span></label>
            </div>
          </div>

          <div class="field" id="subject-field">
            <label class="title" for="q-subject-select">교과</label>
            <select id="q-subject-select"></select>
          </div>

          <div class="field">
            <div class="step-title"><span class="num">4</span>문제 입력</div>
            <textarea id="q-body-input" maxlength="300" required></textarea>
          </div>

          <div class="field" id="mc-fields">
            <label class="title">보기 (정답 보기를 선택하세요)</label>
            <div class="radio-line"><input type="radio" name="mcans" value="0" checked><input type="text" class="mc-text" maxlength="100" placeholder="보기 1"></div>
            <div class="radio-line"><input type="radio" name="mcans" value="1"><input type="text" class="mc-text" maxlength="100" placeholder="보기 2"></div>
            <div class="radio-line"><input type="radio" name="mcans" value="2"><input type="text" class="mc-text" maxlength="100" placeholder="보기 3"></div>
            <div class="radio-line"><input type="radio" name="mcans" value="3"><input type="text" class="mc-text" maxlength="100" placeholder="보기 4"></div>
          </div>

          <div class="field" id="ox-fields" hidden>
            <label class="title">정답</label>
            <div class="seg-group">
              <label class="seg"><input type="radio" name="oxans" value="0" checked><span>O</span></label>
              <label class="seg"><input type="radio" name="oxans" value="1"><span>X</span></label>
            </div>
          </div>

          <p class="error-text" id="q-error" hidden></p>
          <button class="btn" type="submit">문항 추가</button>
        </form>

        <!-- 등록된 문항 -->
        <h3 style="margin-top:28px">등록된 문항</h3>
        <!-- ① 학년 → ② 과목 → ③ 유형 순서로 좁혀 가며 확인 -->
        <div class="tabs" id="q-grades"></div>
        <div class="tabs sub" id="q-subjects"></div>
        <div class="tabs sub" id="q-types"></div>
        <div class="summary" id="q-counts"></div>
        <div class="warn-box" id="q-warn" hidden></div>
        <div class="q-path" id="q-path"></div>
        <div id="q-pager-top"></div>
        <p class="muted" id="q-empty" hidden></p>
        <ul class="q-list" id="q-list"></ul>
        <div id="q-pager"></div>
      </section>
    </div>
  </main>

  <dialog id="seat-dialog">
    <h3 id="dlg-title"></h3>
    <p id="dlg-detail"></p>
    <p class="muted" id="dlg-note" hidden></p>
    <button class="btn danger" id="dlg-reset">재참여 승인 (수료 기록 해지)</button>
    <button class="btn secondary" id="dlg-close">닫기</button>
  </dialog>

  <div class="toast" id="toast" hidden></div>
  <script src="/js/admin.js"></script>
</body>
</html>
